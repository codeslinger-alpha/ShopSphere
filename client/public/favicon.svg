<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ShopSphere">
  <title>ShopSphere</title>
  <!-- The marketplace mark: a shop awning over a sphere. The glyph sits on its
       own green field rather than being tinted by the page, so the same file
       reads identically in the dark and light themes — which is what lets the
       header and the footer share one asset instead of needing two variants. -->
  <defs>
    <linearGradient id="shopsphere-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8552" />
      <stop offset="1" stop-color="#12522a" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="8.5" fill="url(#shopsphere-field)" />

  <!-- Awning: a lintel and four scallops. -->
  <path d="M6 8.4h20v2.7H6z" fill="#eaf6ee" />
  <path
    d="M6 11.1h20v2.3a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0z"
    fill="#cfe3d5"
  />

  <!-- Sphere: a disc with one meridian and one parallel. -->
  <circle cx="16" cy="21.6" r="4.7" fill="#eaf6ee" />
  <ellipse
    cx="16"
    cy="21.6"
    rx="1.95"
    ry="4.7"
    fill="none"
    stroke="#2f8552"
    stroke-width="1.05"
  />
  <path
    d="M11.5 20.3h9M11.4 22.9h9.2"
    stroke="#2f8552"
    stroke-width="1.05"
    stroke-linecap="round"
  />
</svg>
