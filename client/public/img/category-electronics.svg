<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Electronics">
  <title>Electronics</title>
  <!-- Category art is self-contained: the panel carries its own colour, so the
       same file reads correctly on the dark and the light theme and no theme
       token has to reach into an <img>. -->
  <rect width="600" height="400" fill="#1e2b45" />
  <circle cx="505" cy="72" r="130" fill="#2a3c60" />
  <circle cx="88" cy="340" r="96" fill="#2a3c60" opacity="0.7" />
  <!-- A microchip: the one glyph that says "electronics" without a brand. -->
  <g fill="none" stroke="#9dc0ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="230" y="140" width="140" height="140" rx="16" />
    <rect x="272" y="182" width="56" height="56" rx="8" />
    <path d="M262 140v-32M300 140v-32M338 140v-32" />
    <path d="M262 280v32M300 280v32M338 280v32" />
    <path d="M230 176h-32M230 210h-32M230 244h-32" />
    <path d="M370 176h32M370 210h32M370 244h32" />
  </g>
</svg>
