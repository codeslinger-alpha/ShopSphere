<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere — online marketplace</title>
    <script>
      // Runs before the first paint. Dark is the default, so a visitor who
      // chose light must not see a dark frame first. Inline and dependency-free
      // on purpose: the bundle has not loaded yet, and a flash here is exactly
      // what this exists to prevent.
      try {
        var saved = localStorage.getItem("shopsphere_theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {
        // Storage unavailable: fall through to the dark default in index.css.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
